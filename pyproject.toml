[project]
name = "robot-manipulation"
version = "0.1.0"
description = "Explore controlling a robot arm with AI: a simulated arm, swappable AI brains, a path to real hardware."
requires-python = ">=3.10"
dependencies = ["mujoco>=3.2", "numpy", "pillow"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["robot_manipulation"]

[tool.setuptools.package-data]
robot_manipulation = ["assets/*.xml"]
